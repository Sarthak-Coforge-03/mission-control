[project]
name = "mission-control"
version = "0.1.0"
description = "Go/No-Go launch console: anomaly reports, launch-limit checks and Flight Director briefings"
readme = "README.md"
authors = [
    { name = "Sarthak-Coforge-03", email = "sarthak.kakkar@coforge.com" }
]
requires-python = ">=3.12"
dependencies = [
    "django>=6.1.3",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "pytest>=9.2.0",
    "pytest-asyncio>=1.5.0",
    "pytest-cov>=7.1.0",
    "pytest-django>=4.14.0",
    "ruff>=0.17.5",
]

[tool.ruff]
# Migrations are generated by Django; don't lint them.
extend-exclude = ["backend/*/migrations"]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
pythonpath = ["backend"]
testpaths = ["tests"]
addopts = "--cov --cov-report=term-missing:skip-covered"
asyncio_mode = "auto"

[tool.coverage.run]
source = ["backend"]
branch = true
omit = [
    "*/migrations/*",
    "backend/manage.py",
    "backend/config/asgi.py",
    "backend/config/wsgi.py",
]
